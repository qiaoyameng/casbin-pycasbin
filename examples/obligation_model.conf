[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act, eft, audit, mask_fields, channel

[policy_effect]
e = some(where (p_eft == allow)) && !some(where (p_eft == deny))

[matchers]
m = r.sub == p.sub && r.obj == p.obj && r.act == p.act

# Obligation columns and how values from contributing rules are combined.
#   union        - set union of all contributing values
#   intersection - only values required by every contributing rule
#   consensus    - all contributing rules must require the same single value,
#                  otherwise the decision is unexecutable (indeterminate)
[obligation_definition]
o = audit = union, mask_fields = intersection, channel = consensus
